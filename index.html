<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronunciation App</title>

<style>
body{
  font-family:Arial;
  padding:20px;
  background:#f3f4f6;
}

.container{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

textarea{
  width:100%;
  height:100px;
  font-size:16px;
}

button{
  margin-top:10px;
  padding:10px 15px;
  font-size:16px;
}

#score{
  font-size:30px;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>英語発音練習</h1>

<textarea id="text">
I want to improve my English pronunciation.
</textarea>

<br>

<button onclick="speakText()">
音声を聞く
</button>

<button onclick="startRecognition()">
発音して採点
</button>

<h3>認識結果</h3>

<p id="result">
まだ録音されていません
</p>

<h3>スコア</h3>

<div id="score">
0%
</div>

</div>

<script>

function speakText(){

  const text =
    document.getElementById("text").value;

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";

  speechSynthesis.speak(utterance);
}

function similarity(a,b){

  a = a.toLowerCase();
  b = b.toLowerCase();

  const aWords = a.split(" ");
  const bWords = b.split(" ");

  let match = 0;

  aWords.forEach(word=>{

    if(bWords.includes(word)){
      match++;
    }

  });

  return Math.round(
    (match / aWords.length) * 100
  );
}

function startRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("このブラウザは未対応です");

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  document.getElementById("result").innerText =
    "録音中...";

  recognition.start();

  recognition.onresult = function(event){

    const spoken =
      event.results[0][0].transcript;

    document.getElementById("result").innerText =
      spoken;

    const target =
      document.getElementById("text").value;

    const score =
      similarity(target, spoken);

    document.getElementById("score").innerText =
      score + "%";
  };

  recognition.onerror = function(event){

    document.getElementById("result").innerText =
      "エラー: " + event.error;
  };
}

</script>

</body>
</html>
